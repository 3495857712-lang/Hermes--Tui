[tox]
envlist = py311, py312, lint, type
isolated_build = true

[testenv]
deps =
    pytest
    pytest-asyncio
    pytest-cov
extras =
    dev
commands =
    pytest {posargs:tests}

[testenv:lint]
description = Run ruff linter
deps = ruff
commands =
    ruff check src tests

[testenv:type]
description = Run mypy type checker
deps =
    mypy
    types-pyyaml
extras = dev
commands =
    mypy src/hermes_tui

[testenv:format]
description = Format code with ruff
deps = ruff
skip_install = true
commands =
    ruff format src tests
    ruff check --fix src tests

[testenv:coverage]
description = Run tests with coverage report
deps =
    pytest
    pytest-asyncio
    pytest-cov
extras = dev
commands =
    pytest tests --cov=hermes_tui --cov-report=term-missing --cov-report=html
