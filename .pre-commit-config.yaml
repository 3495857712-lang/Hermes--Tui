# Pre-commit hooks configuration for Hermes TUI
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # Ruff linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^src/|^tests/

  # Ruff formatter
      - id: ruff-format
        files: ^src/|^tests/

  # Mypy type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/
        args: [--strict]
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - types-PyYAML
          - httpx>=0.27.0
          - textual>=0.85.0
          - rich>=13.0
          - click>=8.1

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        files: \.(py|md|yml|yaml|toml|txt|sh|ps1)$

      - id: trailing-whitespace
        files: \.(py|md|yml|yaml|toml|txt|sh)$

      - id: check-yaml
        args: [--allow-multiple-documents]

      - id: check-added-large-files
        args: [--maxkb=1024]

      - id: check-merge-conflict

      - id: check-toml

      - id: debug-statements

      - id: mixed-line-ending
        args: [--fix=lf]
